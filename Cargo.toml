[package]
name = "ameleo-display-protocol"
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "D-Bus interfaces between a QEMU -display dbus host and its guest agent"
repository = "https://github.com/ameleo/ameleo-display-protocol"
readme = "README.md"
keywords = ["qemu", "dbus", "guest-agent", "virtualization"]
categories = ["api-bindings", "virtualization"]

[dependencies]
zbus = { version = "6", default-features = false, features = ["p2p", "proxy"] }

[features]
default = ["tokio"]
tokio = ["zbus/tokio"]
# zbus's own runtime (zruntime), for a program without Tokio.
default-rt = ["zbus/default-rt"]
