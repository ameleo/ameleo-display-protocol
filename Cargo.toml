[package]
name = "ameleo-display-protocol"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "D-Bus interfaces between a QEMU -display dbus host and its guest agent"
repository = "https://github.com/ameleo/ameleo-display-protocol"
readme = "README.md"
keywords = ["qemu", "dbus", "guest-agent", "virtualization"]
categories = ["api-bindings", "virtualization"]

[dependencies]
zbus = { version = "5", default-features = false, features = ["p2p"] }

[features]
default = ["tokio"]
tokio = ["zbus/tokio"]
async-io = ["zbus/async-io"]
