name: Bug report
description: An interface does not behave as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The interface and method or signal, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: ameleo-display-protocol version, the host and the agent (name and version) on each side.
    validations:
      required: true
